name: Repository validation

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: repository-validation-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  repository-tests:
    name: privacy, contract, n8n, and Cloudflare tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Scan tracked repository for private data
        run: npm run privacy:check

      - name: Test privacy guard regressions
        run: node --test test/privacy-guard.test.mjs

      - name: Install test and Worker dependencies
        run: npm install --ignore-scripts --no-audit --no-fund

      - name: Validate canonical contracts
        run: npm run test:contracts

      - name: Validate local D1 migrations
        run: npm run cf:migrate:local

      - name: Exercise D1 structured staging SQL
        run: npm run test:d1:staging

      - name: Exercise authoritative D1 invariants
        run: npm run test:d1:authoritative

      - name: Run n8n unit tests
        run: npm run test:n8n:unit

      - name: Run n8n integration tests
        run: npm run test:n8n:integration

      - name: Run n8n e2e simulation tests
        run: npm run test:n8n:e2e

      - name: Run Cloudflare storage tests
        run: npm run test:cloudflare

  n8n-cli-import-smoke-test:
    name: n8n CLI import smoke test
    runs-on: ubuntu-latest
    needs: repository-tests

    env:
      DB_TYPE: sqlite
      DB_SQLITE_POOL_SIZE: '1'
      N8N_ENCRYPTION_KEY: shopping-inventory-ci-test-key

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install n8n CLI
        run: npm install -g n8n

      - name: Import workflow exports with n8n CLI
        run: npm run test:n8n:import

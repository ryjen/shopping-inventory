name: Repository validation

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: repository-validation-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  repository-tests:
    name: repository validation suite
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: npm

      - name: Scan tracked repository for private data
        run: npm run privacy:check

      - name: Install test and Worker dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Run JavaScript validation suite
        run: npm test

      - name: Validate documentation links and structured fixtures
        run: npm run content:check

      - name: Validate local D1 migrations
        run: npm run cf:migrate:local

      - name: Exercise D1 structured staging SQL
        run: npm run test:d1:staging

      - name: Exercise authoritative D1 invariants
        run: npm run test:d1:authoritative

      - name: Exercise review and audit D1 invariants
        run: npm run test:d1:review-audit

      - name: Exercise duplicate and reprocessing D1 invariants
        run: npm run test:d1:duplicates

      - name: Prove synthetic D1 export and isolated restore
        run: npm run test:d1:restore

  n8n-cli-import-smoke-test:
    name: n8n CLI import smoke test
    runs-on: ubuntu-latest
    needs: repository-tests

    env:
      DB_TYPE: sqlite
      DB_SQLITE_POOL_SIZE: '1'
      N8N_ENCRYPTION_KEY: shopping-inventory-ci-test-key
      N8N_CLI_VERSION: '2.42.6'

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm

      - name: Install n8n CLI
        run: npm install -g "n8n@${N8N_CLI_VERSION}" --no-audit --no-fund

      - name: Import workflow exports with n8n CLI
        run: npm run test:n8n:import

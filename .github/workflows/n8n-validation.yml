name: Repository validation

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: repository-validation-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  repository-tests:
    name: repository validation suite
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'

      - name: Scan tracked repository for private data
        run: npm run privacy:check

      - name: Install test and Worker dependencies
        run: npm install --ignore-scripts --no-audit --no-fund

      - name: Capture generated npm lock
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: generated-package-lock
          path: package-lock.json
          if-no-files-found: error
          retention-days: 1

      - name: Commit runner-generated npm lock
        if: github.event_name == 'pull_request' && github.head_ref == 'agent/dependency-security-hardening-clean'
        run: |
          if git diff --quiet -- package-lock.json && git ls-files --error-unmatch package-lock.json >/dev/null 2>&1; then
            echo "package-lock.json already matches generated graph"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "build: commit npm-resolved dependency lock"
          git push origin HEAD:"${GITHUB_HEAD_REF}"

      - name: Run JavaScript validation suite
        run: npm test

      - name: Validate documentation links and structured fixtures
        run: npm run content:check

      - name: Validate local D1 migrations
        run: npm run cf:migrate:local

      - name: Exercise D1 structured staging SQL
        run: npm run test:d1:staging

      - name: Exercise authoritative D1 invariants
        run: npm run test:d1:authoritative

      - name: Exercise review and audit D1 invariants
        run: npm run test:d1:review-audit

      - name: Exercise duplicate and reprocessing D1 invariants
        run: npm run test:d1:duplicates

  n8n-cli-import-smoke-test:
    name: n8n CLI import smoke test
    runs-on: ubuntu-latest
    needs: repository-tests

    env:
      DB_TYPE: sqlite
      DB_SQLITE_POOL_SIZE: '1'
      N8N_ENCRYPTION_KEY: shopping-inventory-ci-test-key
      N8N_CLI_VERSION: '2.42.6'

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'

      - name: Install n8n CLI
        run: npm install -g "n8n@${N8N_CLI_VERSION}" --no-audit --no-fund

      - name: Import workflow exports with n8n CLI
        run: npm run test:n8n:import
